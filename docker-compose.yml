services:
  backend:
    build:
      context: ./Backend_Deployment
      dockerfile: config/Dockerfile
    volumes:
      - .:/workspace:cached
    command: sleep infinity  # Keeps the dev container running
    ports:
      - "7860:7860"

  frontend:
    build:
      context: ./Frontend_Deployment
      dockerfile: config/Dockerfile
    ports:
      - "8501:8501"